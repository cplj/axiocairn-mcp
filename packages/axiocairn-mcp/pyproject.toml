[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiocairn-mcp"
version = "0.0.1"
description = "Connection details for the Axiocairn MCP server (hosted market-research MCP)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Axiocairn Authors" }]
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Homepage = "https://axiocairn.com"
Documentation = "https://axiocairn.com/en/assistant"
Repository = "https://github.com/cplj/axiocairn-mcp"
Issues = "https://github.com/cplj/axiocairn-mcp/issues"

[project.scripts]
axiocairn-mcp = "axiocairn_mcp:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["axiocairn_mcp"]
